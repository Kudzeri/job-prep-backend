apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-prep-api
  namespace: job-prep
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.your-domain.example]
      secretName: job-prep-api-tls
  rules:
    - host: api.your-domain.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: job-prep-api
                port:
                  number: 80
