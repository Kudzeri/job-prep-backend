openapi: 3.0.3
info:
  title: Job Prep Backend API
  version: 1.0.0
  description: |
    API подготовки к собеседованиям, авторизации, тестов и асинхронной генерации по документам.
    Backend отправляет multipart-запрос на ASSESSMENT_SERVICE_URL/requests. Внешний сервис после
    обработки вызывает /api/v1/integrations/assistant/callback с X-Assessment-Callback-Secret.
servers:
  - url: /
    description: Текущий домен приложения
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Integrations
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    message: Server is running!
  /api/v1/auth/email/send:
    post:
      tags: [Auth]
      summary: Send OTP to email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOTPRequest"
            example:
              email: user@example.com
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: OTP код отправлен на ваш email
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: укажите корректный email
        "500":
          description: Send failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: не удалось отправить OTP код
  /api/v1/auth/email/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and issue tokens
      parameters:
        - in: header
          name: User-Agent
          schema:
            type: string
          required: false
          description: Передается автоматически клиентом
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOTPRequest"
            example:
              email: user@example.com
              code: "123456"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
              example:
                access_token: <jwt_access_token>
                refresh_token: <jwt_refresh_token>
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: email и code обязательны
        "401":
          description: OTP invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: неверный или истекший OTP код
  /api/v1/auth/telegram/init:
    post:
      tags: [Auth]
      summary: Create Telegram auth session
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramInitResponse"
              example:
                auth_token: d7c6c4b3-1111-2222-3333-444455556666
                deep_link: https://t.me/<bot_username>?start=d7c6c4b3-1111-2222-3333-444455556666
        "500":
          description: Init failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: не удалось инициализировать авторизацию
  /api/v1/auth/telegram/check:
    get:
      tags: [Auth]
      summary: Check Telegram auth session
      parameters:
        - in: query
          name: auth_token
          required: true
          schema:
            type: string
          example: d7c6c4b3-1111-2222-3333-444455556666
      responses:
        "200":
          description: Pending or approved status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TelegramPendingResponse"
                  - $ref: "#/components/schemas/TelegramApprovedResponse"
              examples:
                pending:
                  value:
                    status: pending
                approved:
                  value:
                    status: approved
                    tokens:
                      access_token: <jwt_access_token>
                      refresh_token: <jwt_refresh_token>
        "400":
          description: Missing auth_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: параметр auth_token обязателен
        "401":
          description: Session invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: сессия не найдена или истекла
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get current profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: неавторизован
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: пользователь не найден
    patch:
      tags: [Users]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
            example:
              first_name: Ivan Updated
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: имя не может быть пустым
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: неавторизован
  /api/v1/users/me/onboarding:
    post:
      tags: [Users]
      summary: Complete onboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteOnboardingRequest"
            example:
              first_name: Ivan
      responses:
        "200":
          description: Onboarding complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: имя не может быть пустым
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: неавторизован
  /api/v1/users/me/tests:
    get:
      tags: [Users]
      summary: Получить личные тесты пользователя
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Личная библиотека тестов
          content:
            application/json:
              schema:
                type: object
                properties:
                  tests:
                    type: array
                    items: { $ref: "#/components/schemas/TestSummary" }
        "401":
          description: Требуется авторизация
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [Users]
      summary: Создать личный тест
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTestRequest" }
      responses:
        "201":
          description: Личный тест создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Test" }
        "401":
          description: Требуется авторизация
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/users/me/tests/{testId}:
    get:
      tags: [Users]
      summary: Получить личный тест с вопросами
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: testId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Тест и вопросы текущего пользователя
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestDetails" }
        "404":
          description: Тест не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/users/me/tests/{testId}/questions:
    post:
      tags: [Users]
      summary: Добавить вопрос в личный тест
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: testId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionInput" }
      responses:
        "201":
          description: Вопрос добавлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "404":
          description: Тест не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/users/me/tests/{testId}/questions/batch:
    post:
      tags: [Users]
      summary: Добавить пакет вопросов в личный тест
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: testId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questions]
              properties:
                questions:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/QuestionInput" }
      responses:
        "201":
          description: Вопросы добавлены одной транзакцией
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items: { $ref: "#/components/schemas/Question" }
        "404":
          description: Тест не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/assistant/chat:
    post:
      tags: [Integrations]
      summary: Отправить резюме и запрос на создание теста
      description: |
        Требует JWT текущего пользователя. Резюме обязательно и должно быть PDF. Можно приложить
        до двух дополнительных PDF, DOCX, TXT или MD файлов. Каждый файл до 10 МБ, суммарно до 24 МБ.
        Сервер сохраняет запрос, передаёт multipart на ASSESSMENT_SERVICE_URL/requests и возвращает
        request_id. Внешний сервис обязан прислать результат на callback endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AssistantChatRequest"
            encoding:
              attachments:
                style: form
                explode: true
      responses:
        "202":
          description: Запрос принят внешним сервисом
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantAcceptedResponse" }
        "400":
          description: Отсутствует резюме или превышены ограничения файлов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Требуется JWT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Внешний сервис не принял запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Сервис генерации не настроен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/assistant/requests/{requestId}:
    get:
      tags: [Integrations]
      summary: Проверить результат обработки документов
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Текущее состояние запроса
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantRequest" }
        "404":
          description: Запрос не найден или принадлежит другому пользователю
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/integrations/assistant/callback:
    post:
      tags: [Integrations]
      summary: Callback внешнего сервиса генерации
      description: |
        Серверная точка возврата результата. Авторизуется общим секретом callback, а не API-ключом
        пользовательских интеграций. Для результата type=test тест атомарно сохраняется в аккаунт
        пользователя, которому принадлежит request_id.
      parameters:
        - in: header
          name: X-Assessment-Callback-Secret
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentCallback" }
            examples:
              message:
                value:
                  request_id: 88e01249-2713-4bca-b0cc-72222483e8af
                  result:
                    type: message
                    message: Резюме получено. Для теста добавьте описание желаемой вакансии.
              test:
                value:
                  request_id: 88e01249-2713-4bca-b0cc-72222483e8af
                  result:
                    type: test
                    title: Подготовка к интервью Go-разработчика
                    description: Вопросы по опыту и навыкам из резюме
                    questions:
                      - text: Чем отличается map от sync.Map?
                        options: [Обычный map не потокобезопасен, Оба всегда потокобезопасны]
                        answer: Обычный map не потокобезопасен
              failed:
                value:
                  request_id: 88e01249-2713-4bca-b0cc-72222483e8af
                  status: failed
                  result:
                    type: message
                    message: Не удалось извлечь текст из резюме.
      responses:
        "200":
          description: Результат сохранён
        "204":
          description: Запрос помечен как неудачный
        "400":
          description: Некорректный результат генерации
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Неверный callback secret
        "409":
          description: Запрос уже обработан или не существует
  /api/v1/profile:
    get:
      tags: [Users]
      summary: Protected profile test route
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/integrations/tests:
    get:
      tags: [Integrations]
      summary: Получить список тестов
      security:
        - integrationApiKey: []
      responses:
        "200":
          description: Библиотека тестов
          content:
            application/json:
              schema:
                type: object
                properties:
                  tests:
                    type: array
                    items: { $ref: "#/components/schemas/TestSummary" }
        "401":
          description: Неверный API-ключ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [Integrations]
      summary: Создать тест с внешнего сайта
      security:
        - integrationApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestRequest"
            example:
              title: Основы Go
              description: Вводный тест
      responses:
        "201":
          description: Тест создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Неверный API-ключ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/integrations/tests/{testId}:
    get:
      tags: [Integrations]
      summary: Получить тест с вопросами
      security:
        - integrationApiKey: []
      parameters:
        - in: path
          name: testId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Тест и список вопросов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestDetails" }
        "404":
          description: Тест не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/integrations/tests/{testId}/questions:
    post:
      tags: [Integrations]
      summary: Добавить один вопрос в тест
      security:
        - integrationApiKey: []
      parameters:
        - in: path
          name: testId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
            example:
              text: Что такое горутина?
              options: ["поток выполнения", "тип данных"]
              answer: "поток выполнения"
      responses:
        "201":
          description: Вопрос добавлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Тест не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/integrations/tests/{testId}/questions/batch:
    post:
      tags: [Integrations]
      summary: Добавить несколько вопросов одной транзакцией
      security:
        - integrationApiKey: []
      parameters:
        - in: path
          name: testId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questions]
              properties:
                questions:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/QuestionInput" }
            example:
              questions:
                - text: Что такое горутина?
                  options: ["поток выполнения", "тип данных"]
                  answer: "поток выполнения"
                - text: Как объявить константу?
                  options: ["const", "let"]
                  answer: const
      responses:
        "201":
          description: Вопросы добавлены
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items: { $ref: "#/components/schemas/Question" }
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Тест не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  securitySchemes:
    integrationApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateTestRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
    Test:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
      required: [id, title, description]
    TestSummary:
      allOf:
        - $ref: "#/components/schemas/Test"
        - type: object
          properties:
            question_count: { type: integer }
          required: [question_count]
    TestDetails:
      allOf:
        - $ref: "#/components/schemas/Test"
        - type: object
          properties:
            questions:
              type: array
              items: { $ref: "#/components/schemas/Question" }
          required: [questions]
    AssistantChatRequest:
      type: object
      required: [message, resume]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Запрос пользователя или пожелания к тесту
        resume:
          type: string
          format: binary
          description: Обязательное резюме PDF, не больше 10 МБ
        attachments:
          type: array
          maxItems: 2
          description: Дополнительные PDF, DOCX, TXT или MD документы
          items:
            type: string
            format: binary
    AssessmentServiceRequest:
      type: object
      description: |
        Multipart-тело, которое backend отправляет на ASSESSMENT_SERVICE_URL/requests.
        Поля request_id, callback_url и message отправляются как текст; resume обязателен,
        attachments отправляются несколькими частями с одинаковым именем поля.
      required: [request_id, callback_url, message, resume]
      properties:
        request_id: { type: string, format: uuid }
        callback_url: { type: string, format: uri }
        message: { type: string, maxLength: 2000 }
        resume: { type: string, format: binary, description: Резюме PDF }
        attachments:
          type: array
          maxItems: 2
          items: { type: string, format: binary }
    AssistantAcceptedResponse:
      type: object
      required: [request_id, status, message]
      properties:
        request_id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
        message: { type: string }
    AssistantRequest:
      type: object
      required: [request_id, status, created_at, updated_at]
      properties:
        request_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, completed, failed] }
        message: { type: string, description: Ответ текстом, если внешний сервис вернул type=message }
        test_id: { type: integer, format: int64, description: Ссылка на созданный личный тест, если вернулся type=test }
        error: { type: string, description: Причина ошибки, если status=failed }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssessmentCallback:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string, format: uuid }
        status:
          type: string
          enum: [failed]
          description: Укажи failed, если не удалось обработать документы; текст положи в result.message
        result:
          type: object
          properties:
            type: { type: string, enum: [message, test] }
            message: { type: string, description: Обязателен для type=message или status=failed }
            title: { type: string, description: Обязателен для type=test }
            description: { type: string }
            questions:
              type: array
              minItems: 1
              maxItems: 500
              items: { $ref: "#/components/schemas/QuestionInput" }
    QuestionInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        options: { type: array, items: {} }
        answer: {}
    Question:
      allOf:
        - $ref: "#/components/schemas/QuestionInput"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            test_id: { type: integer, format: int64 }
          required: [id, test_id]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: Server is running!
      required: [status, message]
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SendOTPRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]
    VerifyOTPRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
      required: [email, code]
    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
      required: [access_token, refresh_token]
    TelegramInitResponse:
      type: object
      properties:
        auth_token:
          type: string
        deep_link:
          type: string
      required: [auth_token, deep_link]
    TelegramPendingResponse:
      type: object
      properties:
        status:
          type: string
          enum: [pending]
      required: [status]
    TelegramApprovedResponse:
      type: object
      properties:
        status:
          type: string
          enum: [approved]
        tokens:
          $ref: "#/components/schemas/AuthTokens"
      required: [status, tokens]
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          nullable: true
        email_verified:
          type: boolean
        telegram_id:
          type: integer
          format: int64
          nullable: true
        telegram_username:
          type: string
          nullable: true
        first_name:
          type: string
          nullable: true
        is_onboarded:
          type: boolean
        role:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - email_verified
        - is_onboarded
        - role
        - is_active
        - created_at
        - updated_at
    CompleteOnboardingRequest:
      type: object
      properties:
        first_name:
          type: string
      required: [first_name]
    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
    ProfileAccessResponse:
      type: object
      properties:
        message:
          type: string
        user_id:
          type: integer
          format: int64
        role:
          type: string
      required: [message, user_id, role]
