databases:
  - name: job-prep-db
    plan: free
    databaseName: job_prep_db
    user: job_prep

services:
  - type: web
    name: job-prep-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_URL
        fromDatabase:
          name: job-prep-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTEGRATION_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://job-prep-api-2rq4.onrender.com,http://localhost:4173,http://127.0.0.1:4173"
      - key: PUBLIC_API_URL
        value: "https://job-prep-api-2rq4.onrender.com"
      - key: ASSESSMENT_SERVICE_URL
        value: ""
      - key: ASSESSMENT_SERVICE_API_KEY
        value: ""
      - key: ASSESSMENT_CALLBACK_SECRET
        value: ""
